version: '3.8'

services:
  bot:
    build: .
    container_name: daylog_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - backend
      - external
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: daylog_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-metabase-ro.sh:/docker-entrypoint-initdb.d/init-metabase-ro.sh:ro  # <--- И это (ro значит read-only)
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1.5G

  redis:
    image: redis:alpine
    container_name: daylog_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
  
  api:
    build: .
    container_name: daylog_api
    restart: unless-stopped
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: daylog_frontend
    restart: unless-stopped
    networks:
      - backend

  caddy:
    image: caddy:alpine
    container_name: daylog_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN}
    volumes:
      - caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # <--- Подключаем конфиг
    networks:
      - backend

  dozzle:
    image: amir20/dozzle:latest
    container_name: daylog_dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_BASE=/bimba-daylog-dozzle-logs  # <--- Передаем путь через переменную
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"

  metabase:
      image: metabase/metabase:latest
      container_name: daylog_metabase
      restart: always
      ports:
        - "127.0.0.1:3000:3000"
      volumes:
        - metabase-data:/metabase.db
      environment:
        - MB_DB_FILE=/metabase.db/metabase.db
      depends_on:
        - db
      networks:          
        - backend

networks:
  backend:
    driver: bridge
  external:
    driver: bridge    # Bot → Telegram API / LLM API

volumes:
  postgres_data:
  redis_data:
  metabase-data:
  caddy_data:
  caddy_config: