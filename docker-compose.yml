version: '3.8'

services:
  bot:
    build: .
    container_name: daylog_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - backend
      - external
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: daylog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1.5G

  redis:
    image: redis:alpine
    container_name: daylog_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  backend:
    driver: bridge
    internal: true    # DB/Redis недоступны из интернета
  external:
    driver: bridge    # Bot → Telegram API / LLM API

volumes:
  postgres_data:
  redis_data: