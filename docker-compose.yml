version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: daylog_db
    restart: always
    environment:
      POSTGRES_USER: daylog_user
      POSTGRES_PASSWORD: daylog_password
      POSTGRES_DB: daylog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:alpine
    container_name: daylog_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
