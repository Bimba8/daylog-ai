services:
  db:
    image: postgres:15-alpine
    container_name: daylog_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daylog_user_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daylog_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-daylog_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: daylog_redis_dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data_dev:/data

volumes:
  postgres_data_dev:
  redis_data_dev: